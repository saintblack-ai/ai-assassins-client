<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SPYMASTER: ARCHAIOS — AI ASSASSINS</title>
<style>
:root{--gold:#e0b84d;--cyan:#7ee7ff;--ink:#06080d;--panel:#070b12e6;--line:#2a3545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--ink);color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#090d14}
#cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#142033 0,#06080d 58%);z-index:20;padding:20px}.card{text-align:center;max-width:520px}.sig{font-size:28px;color:var(--gold)}.title{font-size:clamp(44px,14vw,92px);font-weight:900;letter-spacing:.04em}.sub{color:var(--cyan);letter-spacing:.12em;font-size:clamp(12px,3.5vw,18px)}.copy{color:#a7b0bd;line-height:1.55;margin:20px 0}.btn{background:#111824;color:var(--gold);border:1px solid var(--gold);padding:15px 28px;font-size:18px;font-weight:800;border-radius:10px}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));z-index:5}.row{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);padding:7px 9px;font-size:11px;border-radius:6px}.topr{position:absolute;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:6px}.bottom{position:absolute;left:10px;bottom:calc(106px + env(safe-area-inset-bottom));display:flex;gap:6px}#msg{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);background:#070b12f2;border:1px solid var(--gold);padding:10px 14px;border-radius:8px;opacity:0;transition:.15s;white-space:nowrap}
#controls{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));height:92px;z-index:10;pointer-events:none}.pad{position:absolute;left:12px;bottom:0;width:92px;height:92px;pointer-events:auto}.pad button{position:absolute;width:38px;height:38px;border-radius:50%;border:1px solid #46536a;background:#0b111bcc;color:#fff;font-size:18px;font-weight:800}#up{left:27px;top:0}#down{left:27px;bottom:0}#left{left:0;top:27px}#right{right:0;top:27px}.actions{position:absolute;right:12px;bottom:0;display:flex;gap:10px;align-items:flex-end;pointer-events:auto}.action{border-radius:50%;border:1px solid var(--gold);background:#111824e8;color:var(--gold);font-weight:900}#pulse{width:74px;height:74px;font-size:13px}#interact{width:58px;height:58px;font-size:12px;border-color:var(--cyan);color:var(--cyan)}
@media (max-width:480px){.chip{font-size:10px;padding:6px 7px}.topr{top:52px}.bottom{bottom:112px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="row"><span class="chip">♠ 009 / ARCHAIOS</span><span id="objective" class="chip">OBJECTIVE: RECOVER 3 INTEL SHARDS</span></div><div class="topr"><span id="health" class="chip">INTEGRITY 100</span><span id="legacy" class="chip">LEGACY 0000</span></div><div class="bottom"><span id="intel" class="chip">INTEL 0/3</span><span id="uplink" class="chip">UPLINK OFFLINE</span></div><div id="msg"></div></div>
<div id="controls"><div class="pad"><button id="up">▲</button><button id="down">▼</button><button id="left">◀</button><button id="right">▶</button></div><div class="actions"><button id="interact" class="action">HACK</button><button id="pulse" class="action">PULSE</button></div></div>
<div id="cover"><div class="card"><div class="sig">♠ 009</div><div class="title">SPYMASTER</div><div class="sub">ARCHAIOS // AI ASSASSINS</div><div class="copy">OPERATION FIRST LIGHT<br>Recover the signal. Protect the archive. Build the legacy.<br><br><b>iPhone:</b> use the directional pad, PULSE and HACK buttons.</div><button id="deploy" class="btn">DEPLOY</button></div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,dpr=1;function rs(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',rs);rs();const ui={o:$('objective'),h:$('health'),l:$('legacy'),i:$('intel'),u:$('uplink'),m:$('msg'),cover:$('cover')};let run=false,hp=100,score=0,got=0,uplinkOn=false,stage=0,last=0;const p={x:120,y:120,r:16};let shards=[],enemies=[],shots=[];const input={up:0,down:0,left:0,right:0};function reset(){hp=100;score=0;got=0;uplinkOn=false;stage=0;p.x=Math.max(70,W*.18);p.y=Math.max(110,H*.25);shards=[{x:W*.28,y:H*.30,g:0},{x:W*.50,y:H*.55,g:0},{x:W*.74,y:H*.34,g:0}];enemies=[{x:W*.42,y:H*.35,h:2},{x:W*.60,y:H*.50,h:2},{x:W*.78,y:H*.62,h:2}];shots=[];run=true;hud()}function hud(){ui.h.textContent='INTEGRITY '+hp;ui.l.textContent='LEGACY '+String(score).padStart(4,'0');ui.i.textContent='INTEL '+got+'/3';ui.u.textContent=uplinkOn?'UPLINK SECURE':'UPLINK OFFLINE';ui.o.textContent=stage===0?'OBJECTIVE: RECOVER 3 INTEL SHARDS':stage===1?'OBJECTIVE: REACH UPLINK + HACK':'OBJECTIVE: REACH EXTRACTION + HACK'}function note(t){ui.m.textContent=t;ui.m.style.opacity=1;clearTimeout(note.t);note.t=setTimeout(()=>ui.m.style.opacity=0,1200)}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}$('deploy').onclick=()=>{ui.cover.style.display='none';reset()};function shoot(){if(!run)return;const now=performance.now();if(now-last<250)return;last=now;let t=enemies.filter(e=>e.h>0).sort((a,b)=>d(p,a)-d(p,b))[0];if(!t||d(p,t)>300){note('NO TARGET IN RANGE');return}let dx=t.x-p.x,dy=t.y-p.y,L=Math.hypot(dx,dy)||1;shots.push({x:p.x,y:p.y,vx:dx/L*9,vy:dy/L*9})}function interact(){if(!run)return;const term={x:W*.78,y:H*.76},ext={x:W*.88,y:H*.80};if(stage===1&&d(p,term)<78){uplinkOn=true;stage=2;score+=500;note('ARCHAIOS UPLINK SECURED');hud()}else if(stage===2&&d(p,ext)<78){score+=1000;note('MISSION COMPLETE — LEGACY PRESERVED');hud();run=false;setTimeout(()=>ui.cover.style.display='flex',1400)}else note('MOVE CLOSER TO OBJECTIVE')}const bindHold=(id,key)=>{const el=$(id),on=e=>{e.preventDefault();input[key]=1},off=e=>{e.preventDefault();input[key]=0};['pointerdown','touchstart'].forEach(ev=>el.addEventListener(ev,on,{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>el.addEventListener(ev,off,{passive:false}))};bindHold('up','up');bindHold('down','down');bindHold('left','left');bindHold('right','right');$('pulse').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});$('pulse').addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false});$('interact').addEventListener('pointerdown',e=>{e.preventDefault();interact()});$('interact').addEventListener('touchstart',e=>{e.preventDefault();interact()},{passive:false});function tick(){requestAnimationFrame(tick);if(run){let dx=(input.right?1:0)-(input.left?1:0),dy=(input.down?1:0)-(input.up?1:0),L=Math.hypot(dx,dy)||1;p.x=Math.max(18,Math.min(W-18,p.x+dx/L*4.1));p.y=Math.max(18,Math.min(H-120,p.y+dy/L*4.1));for(const s of shards)if(!s.g&&d(p,s)<30){s.g=1;got++;score+=100;note('INTEL SHARD RECOVERED');if(got===3)stage=1;hud()}for(const e of enemies)if(e.h>0){let dd=d(e,p);if(dd<280){e.x+=(p.x-e.x)/(dd||1)*.85;e.y+=(p.y-e.y)/(dd||1)*.85}if(dd<27){hp=Math.max(0,hp-1);if(hp===0){run=false;note('SIGNAL LOST');setTimeout(()=>ui.cover.style.display='flex',1100)}hud()}}for(const s of shots){s.x+=s.vx;s.y+=s.vy;for(const e of enemies)if(e.h>0&&d(s,e)<20){e.h--;s.dead=1;if(e.h<=0){score+=75;note('SENTINEL DISABLED');hud()}}}shots=shots.filter(s=>!s.dead&&s.x>0&&s.x<W&&s.y>0&&s.y<H)}draw()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080c13';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#172131';ctx.lineWidth=1;for(let gx=0;gx<W;gx+=42){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}for(let gy=0;gy<H;gy+=42){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}const term={x:W*.78,y:H*.76},ext={x:W*.88,y:H*.80};ctx.strokeStyle='#6ee7ff';ctx.lineWidth=2;ctx.strokeRect(term.x-24,term.y-24,48,48);ctx.fillStyle=uplinkOn?'#6ee7ff':'#243142';ctx.fillRect(term.x-10,term.y-10,20,20);ctx.strokeStyle='#e0b84d';ctx.beginPath();ctx.arc(ext.x,ext.y,30,0,Math.PI*2);ctx.stroke();for(const s of shards)if(!s.g){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(performance.now()/900);ctx.strokeStyle='#7ee7ff';ctx.strokeRect(-10,-10,20,20);ctx.restore()}for(const e of enemies)if(e.h>0){ctx.fillStyle='#ff5c6a';ctx.beginPath();ctx.arc(e.x,e.y,14,0,Math.PI*2);ctx.fill()}for(const s of shots){ctx.fillStyle='#e0b84d';ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#e0b84d';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#05070b';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('009',p.x,p.y)}tick()})();
</script>
</body>
</html>
